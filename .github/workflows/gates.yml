name: gates

# AGENTS.md promises a CI gate in four places: §1.1 (the 250-line source limit),
# §1.2 (the required file header), §1.4 (go vet, staticcheck, the linter suite)
# and §2.1 (go test -race). The checks were implemented, but only as git hooks
# under scrypts/hooks, which `--no-verify` walks straight past and a fresh clone
# never runs at all. This workflow is the gate those sections describe.
#
# The checks are called individually rather than through scrypts/gates/all.sh
# because all.sh also runs panel-check, which needs the app-ui dependency
# install; wiring the panel surface is deliberately left out and named here so
# the gap is visible rather than silently green.
#
# Graphify (`/graphify update`) is a review step, not a shell gate, so it is not
# reproduced here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go gates, contracts, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # go-test.sh runs the integration suite only when a DSN is present, and the
    # harness refuses a database whose name does not say it is a test one because
    # the suite truncates its tables. Both conditions are satisfied here, so the
    # Postgres and Redis layers are actually exercised rather than compiled.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: gate
          POSTGRES_DB: pannelai_gate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PANNELAI_TEST_POSTGRES_DSN: postgres://postgres:gate@127.0.0.1:5432/pannelai_gate_test?sslmode=disable
      PANNELAI_TEST_REDIS_ADDR: 127.0.0.1:6379
      # changed_files reads the tree plus this base, so the §1.1 and §1.2 gates
      # inspect the patch instead of an empty worktree.
      GATES_BASE_REF: ${{ github.event_name == 'pull_request' && format('refs/remotes/origin/{0}', github.base_ref) || github.event.before }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: app-serv/go.mod
          cache: true

      - name: Install the linters AGENTS.md §1.4 names
        run: |
          set -euo pipefail
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.24.3
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: go lint (vet, gofmt, staticcheck, golangci-lint, §1.1 line limit)
        run: bash scrypts/gates/go-lint.sh

      - name: go headers (AGENTS.md §1.2)
        run: bash scrypts/gates/go-headers.sh

      - name: go test -race, plus the tagged suites (§2.1)
        run: bash scrypts/gates/go-test.sh

      - name: contract drift (SPEC-API to panel)
        run: bash scrypts/gates/contract-drift.sh

      - name: contract artifact (OpenAPI YAML to JSON)
        run: bash scrypts/gates/contract-openapi.sh

      - name: secrets (gitleaks)
        run: bash scrypts/gates/secrets.sh --all
