# gitleaks configuration for pannelAI.
#
# The default ruleset is kept as-is; this file only records the values that the
# generic-api-key heuristic flags on this repository and that are provably not
# credentials. Each entry names why, because an allowlist without a reason is
# how a real secret eventually gets waved through.
#
# Referenced by scrypts/gates/secrets.sh (via --config), so the hook and the CI
# run scan with the same rules.

title = "pannelAI"

[extend]
# Start from the upstream default ruleset rather than replacing it: this file
# adds an allowlist, it does not relax a rule.
useDefault = true

[allowlist]
description = "Test fixtures and the key-generation alphabet, none of which are credentials"

# Two entries, both narrow: a literal value on a literal path. They are not
# path-wide exemptions, so a real key committed to these files is still caught.
paths = []

regexTarget = "match"
regexes = [
  # The Cloud Code Assist thought-signature filler the gateway replays on a tool call
  # (app-serv/internal/dataplane/gemini_thought.go). It is an opaque token Google
  # issued for one thinking turn and then publishes in the reference's own source, so
  # it identifies no account, grants nothing, and cannot be rotated. Listed as the
  # exact literal, not as a base64 shape or a path exemption: a real credential that
  # lands in that file is still caught.
  '''EuwGCukGAXLI2nxwZIq54WWSoL/YN0P3TsDZ7zRnLi8g0S4aVr2HUGxvaHKySuY6HAVzcE0GPGjXrytLIldxthSvfxgUlJh6Qa9Z\+Oj5QZBlYdg6HaJ6yuY5R7waE6rdwBsRf7Ft2j3DJ9rMi9qhWFqApewYtPhls3VHtuvND3l8Rm09\+lbAXQs6KKWEWrxNLKTBkfpMgXhRERc/TQRMZu1twAablm6/Zk1tsYRvfWKLsNbeKF\+CCojJdXJKvnR/8Ouuoa\+Y2Ti20hcW7aZIIjZDFYPU//k6Ybmhg69J/imbFai2ckhfLaisqdDkdoIiBJScTOUvYqP6AE9d4MsydSC\+UlhIMk4hoP76R8vUSCZRMkjOaDXstf/QoVZKbt94wyRZgAJ1G0BqI8L5ow86kLpA4wJEtxsRGymOE4bKUvApveBakYDNM9APkf\+LbtbzWSseGjoZcSlycF9iN8Q2XNYKRrHbv3Lr5Y8JjdH/5y/6SHkNehTEZugaeGnSPSyCTWto1kQgHpxdWmhkLfJGNUGLmue7Mesj4TSms4J33mRpYVhNB/J333FCqIP0hr/E7BkkjEn7yZ4X7SQlh\+xKPurapsnHRwiKmtsilmEFrnTE9iQr\+pMr6M29qqFNv1tr5yumbaJw8JW9sB15tNsRv\+dW6BjNanbsKz7HCgKUBc8tGy\+7YuhXzAfViyRefcjK7eZW0Fbyt7AbybJTKz78W8NH7ye6LAwzOebXpeZ4D43fNIt8bKh26qgduSQv/7o\+pAflkuqHZ99YWgHQ8h8OkZFi3eOiSYjsjhdZ/czWOdoPI/OnqIldzMPF5YlrKBLFX8VhRKVmqgsmWf5PHGulHhMkVlS\+XG2UIseGy69ARa93D78Gsa\+1n1kJr7EEB7Rh\+27vUMxVYLdz1yMSvE5nalTAlg/ZeG8\+XQ0cHuAI3KbQpHW2Q\+\+RdXfm5JzD5WdJZUU\+Zn8t8UUn85BH4RxZLeE0qJikgSsKoYVBc6YhiMjhPgkR95ReimY4Z0xCJdRo1gjexOFeODZMpQF6Yxnoic7IrdgsFA3iePTbFnPp3IAM1fAThWhXJUn3QInUOTd5o1qmTmn6REbL15g/JQNl\+dqUoPkhleeb2V3kjqp1okmO3wMZbPknR3S1LZNmlS72/iBQUm\+n2b/RCn4PjmM2''',

  # The masking tests need an input whose interior is long enough to be hidden.
  # It is a fixture, never sent anywhere, and its prefix ("sk-") is deliberate
  # so the masking transform is exercised on a realistic shape.
  '''abcdEfghIJKLmnopQRSTuvwx1234567890ABCDEFGH''',

  # The character set keys are generated from. It is published in the binary and
  # is the alphabet, not a secret: the entropy comes from crypto/rand, and the
  # alphabet's only design constraint is that it omits ambiguous characters.
  '''abcdefghijkmnpqrstuvwxyz23456789ABCDEFGHJKLMNPQRSTUVWXYZ''',
]