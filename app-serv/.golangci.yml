# golangci-lint configuration for pannelAI Go services (schema v2).
#
# AGENTS.md §1.4 requires "an aggregated linter suite that flags unchecked
# errors, missing context timeouts on outbound calls, unclosed HTTP response
# bodies, and unclosed DB rows/statements". Each linter below maps to one of
# those requirements, and the mapping is written down so a later reader knows
# why a linter is on rather than deleting it as noise.
#
# Run it with scrypts/gates/go-lint.sh, which reports it as skipped when the
# binary is absent rather than passing silently.
#
# Verify any edit with: golangci-lint config verify
# A config that does not match this schema is rejected, not partially applied,
# which is why verify belongs in the loop when changing this file.

version: "2"

linters:
  default: standard

  enable:
    # ---- unchecked errors (§1.4) ----
    - errcheck

    # ---- unclosed HTTP bodies, rows, statements (§1.4) ----
    - bodyclose
    - rowserrcheck
    - sqlclosecheck

    # ---- context on outbound calls (§1.6) ----
    - noctx
    - contextcheck

    # ---- error hygiene (§1.6) ----
    - errchkjson
    - nilerr

    # ---- banned constructs (§1.4) ----
    - forbidigo

    # ---- everyday correctness ----
    - copyloopvar
    - gocritic
    - misspell
    - unconvert
    - unparam
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # hugeParam and rangeValCopy advise passing structs over a size
        # threshold by pointer. This codebase models its entities and DTOs as
        # immutable value objects with unexported fields (AGENTS.md §2.2), so
        # they are passed and copied by value throughout: a pointer would add
        # aliasing and a mutate-in-place contract that the aggregate exists to
        # prevent, to save an 80-184 byte copy on paths that are not hot. The
        # size heuristic does not know that, and per-file exclusions would
        # scatter the same reasoning across a dozen paths.
        - hugeParam
        - rangeValCopy

    forbidigo:
      # §1.4 forbids `any`/`interface{}` in application code outside a declared
      # I/O boundary. A blanket ban is impossible: JSON decoding, pgx Scan, and
      # the response writer genuinely need them. So the rule bans the pattern
      # where a leak actually hurts, and the boundary files are excluded below.
      analyze-types: true
      forbid:
        - pattern: 'interface\{\}'
          msg: "AGENTS.md §1.4: use a concrete type; interface{} belongs only at a declared I/O boundary"
        - pattern: '^any$'
          msg: "AGENTS.md §1.4: use a concrete type; any belongs only at a declared I/O boundary"

  exclusions:
    # Generated code is exempt per AGENTS.md §1.1.
    generated: lax

    rules:
      # The decode/encode boundaries §1.4 explicitly permits. Each file is named
      # so the exemption stays visible instead of pattern-matched by accident.
      - path: internal/schema/(dto|respond)\.go
        linters: [forbidigo]
      - path: internal/repository/postgres/.*\.go
        linters: [forbidigo]

      # handler/endpoint_body.go holds decodeInto: the request body is read once
      # into a concrete DTO the caller validates immediately, which is the exact
      # decode boundary §1.4 names as permitted.
      - path: internal/handler/endpoint_body\.go
        linters: [forbidigo]

      # service/settings.go: decodeOr is a generic, and an unconstrained type
      # parameter has no spelling other than `any`; groupValue returns one of the
      # typed settings structs for JSON persistence, a union a concrete return
      # type cannot express without duplicating the switch per caller.
      - path: internal/service/settings\.go
        linters: [forbidigo]

      # The dataplane's wire translators (translate_*.go, engine_translate.go)
      # speak the vendors' own formats: an upstream answer arrives untyped and is
      # read member by member, and a Claude SSE frame is assembled from members
      # the upstream models as a free-form object. This is the untyped
      # third-party-response boundary §1.4 permits; everything on the CLIENT side
      # of these files stays in schema DTOs.
      - path: internal/dataplane/(translate_.*|engine_translate)\.go
        linters: [forbidigo]

      # reasoning rewrites a body the gateway forwards member by member: every
      # field the client set has to survive untouched and only the thinking
      # fields are replaced, so the body is held as an untyped JSON object and
      # the values written into it are the wire's own free-form shapes (a
      # Claude thinking block, a Gemini thinkingConfig, a bare effort string).
      # This is the same outbound-wire boundary the dataplane translators sit
      # on, and it is the only package outside them that reads a body this way.
      - path: internal/reasoning/.*\.go
        linters: [forbidigo]

      # reasoning's level and suffix tables are read after lowercasing and
      # trimming, so a test row deliberately carries surrounding whitespace:
      # " HIGH " proves the normalization, and "gpt-5.5( high ) " proves the
      # suffix parser trims both sides of the group. mapKey's whitespace
      # heuristic exists to catch a typo, which is exactly what these rows
      # prove these values are not.
      - path: internal/reasoning/.*_test\.go
        linters: [gocritic]
        text: "mapKey"

      # noctx targets *outbound* calls that must carry a deadline. A test builds
      # an inbound request with httptest.NewRequest on purpose: it is the input
      # the handler receives, not a call the test makes, so there is no caller
      # context to attach and §1.6's timeout requirement does not apply.
      - path: _test\.go
        linters: [noctx, forbidigo, unparam, errcheck]

      # hugeParam and rangeValCopy advise passing large structs by pointer. For
      # these two types that advice makes the code worse: SystemInfo and
      # GatewayKey are immutable value objects that are only read, and a pointer
      # would introduce aliasing (a caller could mutate what another holds) to
      # save a copy of 80-128 bytes on a path that is not hot. The exclusion is
      # a judgement about this codebase, not a blanket silencing.
      - path: internal/schema/respond\.go
        linters: [gocritic]
        text: "hugeParam"
      - path: internal/router/.*_test\.go
        linters: [gocritic]
        text: "hugeParam|rangeValCopy"
      # The repository takes and returns domain aggregates by value, matching
      # Create, GetByID, and Revoke. Taking a pointer only for Update would make
      # the interface inconsistent to satisfy a size heuristic, and a mutate-in-
      # place contract is exactly what the unexported-field aggregate prevents.
      - path: internal/repository/(gateway_key|postgres/gateway_key)\.go
        linters: [gocritic]
        text: "hugeParam"

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0